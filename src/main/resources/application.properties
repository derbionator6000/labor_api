# Server-Port (Standard: 8080)
server.port=8080

# Anwendungsname
spring.application.name=shipwatch

# JSON hübsch formatiert ausgeben (nur für Entwicklung)
spring.jackson.serialization.indent-output=true

# H2-Datenbank (in-memory)
spring.datasource.url=jdbc:h2:mem:shipwatch
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2-Konsole (Browser-Zugriff: http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Hibernate / JPA (ddl-auto=update nur in der Entwicklung!)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
# In Produktion deaktivieren:
# springdoc.api-docs.enabled=false
# springdoc.swagger-ui.enabled=false
