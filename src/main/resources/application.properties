# Server-Port (Standard: 8080)
server.port=8080

# Anwendungsname
spring.application.name=shipwatch

# JSON hübsch formatiert ausgeben (nur für Entwicklung)
spring.jackson.serialization.indent-output=true

# H2-Datenbank (In-Memory), Konsole: http://localhost:8080/h2-console
spring.datasource.url=jdbc:h2:mem:shipwatch
spring.h2.console.enabled=true
