<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ShipWatch</title>
<style>
  :root { --bg:#f4f6f8; --card:#fff; --text:#1d2530; --muted:#667085; --line:#dde2e8; --accent:#1f6feb; --danger:#c0392b; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, sans-serif; background:var(--bg); color:var(--text); }
  header { background:#0b2540; color:#fff; padding:14px 20px; }
  header h1 { margin:0; font-size:20px; }
  main { max-width:1000px; margin:0 auto; padding:16px; display:grid; gap:16px; }
  section { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:16px; }
  h2 { margin:0 0 12px; font-size:16px; }
  .toolbar { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
  input, select, button { font:inherit; padding:6px 10px; border:1px solid var(--line); border-radius:6px; }
  button { background:var(--accent); color:#fff; border-color:var(--accent); cursor:pointer; }
  button.secondary { background:#fff; color:var(--text); border-color:var(--line); }
  button.danger { background:var(--danger); border-color:var(--danger); }
  table { width:100%; border-collapse:collapse; }
  th, td { text-align:left; padding:8px; border-bottom:1px solid var(--line); font-size:14px; }
  th { color:var(--muted); font-weight:600; }
  tr.selected { background:#eaf2ff; }
  td.actions { white-space:nowrap; text-align:right; }
  td.actions button { padding:3px 8px; font-size:13px; }
  .badge { padding:2px 8px; border-radius:10px; font-size:12px; background:#eee; }
  .badge.yes { background:#fde2df; color:var(--danger); }
  form.grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(160px, 1fr)); gap:8px; }
  .muted { color:var(--muted); font-size:14px; }
  .table-wrap { overflow-x:auto; }
  #error { color:var(--danger); min-height:1em; }
</style>
</head>
<body>
<header><h1>ShipWatch &ndash; Beobachtete Schiffe</h1></header>
<main>
  <section>
    <div class="toolbar">
      <select id="filter">
        <option value="">Alle Schiffe</option>
        <option value="dangerous">Nur Gefahrgut</option>
        <option value="large">Nur große (&gt; 200 m)</option>
      </select>
      <input id="search" placeholder="Name suchen…">
      <button class="secondary" id="reload">Aktualisieren</button>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>Name</th><th>MMSI</th><th>Typ</th><th>Länge</th><th>Ziel</th><th>Gefahrgut</th><th></th></tr></thead>
        <tbody id="ships"></tbody>
      </table>
    </div>
    <p id="error"></p>
  </section>

  <section>
    <h2>Schiff hinzufügen</h2>
    <form id="shipForm" class="grid">
      <input name="name" placeholder="Name" required>
      <input name="mmsi" type="number" placeholder="MMSI" required>
      <input name="shipType" placeholder="Typ (z. B. Tanker)">
      <input name="lengthM" type="number" step="0.1" placeholder="Länge in m">
      <input name="destination" placeholder="Ziel">
      <label class="muted"><input name="dangerousCargo" type="checkbox"> Gefahrgut</label>
      <button type="submit">Anlegen</button>
    </form>
  </section>

  <section id="sightingsSection" hidden>
    <h2 id="sightingsTitle">Sichtungen</h2>
    <form id="sightingForm" class="grid">
      <input name="observerName" placeholder="Beobachter" required>
      <input name="observedAt" type="datetime-local" required>
      <input name="location" placeholder="Ort">
      <input name="notes" placeholder="Notizen">
      <button type="submit">Sichtung speichern</button>
    </form>
    <div class="table-wrap">
      <table>
        <thead><tr><th>Zeitpunkt</th><th>Beobachter</th><th>Ort</th><th>Notizen</th></tr></thead>
        <tbody id="sightings"></tbody>
      </table>
    </div>
  </section>
</main>

<script>
const API = '/api/tracked-ships';
let selectedShip = null;

const $ = (id) => document.getElementById(id);
const esc = (v) => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

async function api(path, options = {}) {
  const res = await fetch(API + path, { headers: { 'Content-Type': 'application/json' }, ...options });
  if (!res.ok) throw new Error(`${options.method || 'GET'} ${path}: HTTP ${res.status}`);
  return res.status === 204 ? null : res.json();
}

function showError(e) { $('error').textContent = e ? e.message : ''; }

async function loadShips() {
  const search = $('search').value.trim();
  const filter = $('filter').value;
  let path = '';
  if (search) path = '/search?name=' + encodeURIComponent(search);
  else if (filter === 'dangerous') path = '?dangerousCargo=true';
  else if (filter === 'large') path = '/large';
  try {
    const ships = await api(path);
    $('ships').innerHTML = ships.map(s => `
      <tr data-id="${s.id}" class="${selectedShip?.id === s.id ? 'selected' : ''}">
        <td>${esc(s.name)}</td><td>${s.mmsi}</td><td>${esc(s.shipType)}</td>
        <td>${s.lengthM} m</td><td>${esc(s.destination)}</td>
        <td><span class="badge ${s.dangerousCargo ? 'yes' : ''}">${s.dangerousCargo ? 'ja' : 'nein'}</span></td>
        <td class="actions">
          <button class="secondary" data-action="sightings">Sichtungen</button>
          <button class="secondary" data-action="toggle">Gefahrgut ⇄</button>
          <button class="danger" data-action="delete">Löschen</button>
        </td>
      </tr>`).join('') || '<tr><td colspan="7" class="muted">Keine Schiffe gefunden.</td></tr>';
    window.shipsById = Object.fromEntries(ships.map(s => [s.id, s]));
    showError(null);
  } catch (e) { showError(e); }
}

async function loadSightings() {
  if (!selectedShip) return;
  $('sightingsSection').hidden = false;
  $('sightingsTitle').textContent = 'Sichtungen: ' + selectedShip.name;
  try {
    const list = await api(`/${selectedShip.id}/sightings`);
    $('sightings').innerHTML = list.map(s => `
      <tr><td>${esc(s.observedAt.replace('T', ' '))}</td><td>${esc(s.observerName)}</td>
      <td>${esc(s.location)}</td><td>${esc(s.notes)}</td></tr>`).join('')
      || '<tr><td colspan="4" class="muted">Noch keine Sichtungen.</td></tr>';
  } catch (e) { showError(e); }
}

$('ships').addEventListener('click', async (ev) => {
  const btn = ev.target.closest('button');
  if (!btn) return;
  const id = Number(btn.closest('tr').dataset.id);
  try {
    if (btn.dataset.action === 'toggle') {
      await api(`/${id}/dangerous-cargo`, { method: 'PATCH' });
    } else if (btn.dataset.action === 'delete') {
      if (!confirm('Schiff inkl. Sichtungen löschen?')) return;
      await api(`/${id}`, { method: 'DELETE' });
      if (selectedShip?.id === id) { selectedShip = null; $('sightingsSection').hidden = true; }
    } else if (btn.dataset.action === 'sightings') {
      selectedShip = window.shipsById[id];
      await loadSightings();
    }
    await loadShips();
  } catch (e) { showError(e); }
});

$('shipForm').addEventListener('submit', async (ev) => {
  ev.preventDefault();
  const f = ev.target;
  const body = {
    name: f.name.value, mmsi: Number(f.mmsi.value), shipType: f.shipType.value,
    lengthM: Number(f.lengthM.value || 0), destination: f.destination.value,
    dangerousCargo: f.dangerousCargo.checked
  };
  try { await api('', { method: 'POST', body: JSON.stringify(body) }); f.reset(); await loadShips(); }
  catch (e) { showError(e); }
});

$('sightingForm').addEventListener('submit', async (ev) => {
  ev.preventDefault();
  const f = ev.target;
  const body = {
    observerName: f.observerName.value, observedAt: f.observedAt.value + ':00',
    location: f.location.value, notes: f.notes.value
  };
  try { await api(`/${selectedShip.id}/sightings`, { method: 'POST', body: JSON.stringify(body) }); f.reset(); await loadSightings(); }
  catch (e) { showError(e); }
});

$('filter').addEventListener('change', loadShips);
$('search').addEventListener('input', loadShips);
$('reload').addEventListener('click', loadShips);
loadShips();
</script>
</body>
</html>
